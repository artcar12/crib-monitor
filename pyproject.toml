[project]
name = "crib-monitor"
version = "0.1.0"
description = "Crib camera roll-over monitor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "litellm==1.102.1",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[project.scripts]
crib-monitor = "crib_monitor.main:run"
crib-monitor-eval = "crib_monitor.evaluate:run"
crib-monitor-probe = "crib_monitor.probe:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crib_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs ffmpeg and mediamtx on PATH"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
